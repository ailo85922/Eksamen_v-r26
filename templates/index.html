<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Hjem</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);

    a {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: green;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    a:hover {
      background: darkgreen;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Velkommen, {{ brukernavn }}! 👋</h2>
    <a href="/gjett">Spill gjett-spillet 🎯</a>

</body>
</html>
